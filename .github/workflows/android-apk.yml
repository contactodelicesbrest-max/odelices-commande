name: APK Android HACCP

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "haccp/**"
      - "android/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "vite.haccp.config.js"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'appli web HACCP
        run: npm run build:haccp

      - name: Copier dans le projet Android
        run: npx cap sync android

      - name: Construire l'APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../odelices-haccp.apk

      - name: Fichier APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: odelices-haccp-apk
          path: odelices-haccp.apk

      - name: Publier la dernière version (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: haccp-latest
          name: O'Délices HACCP (dernière version)
          prerelease: false
          make_latest: true
          body: |
            APK Android de l'appli HACCP — version 1.0.${{ github.run_number }}.
            Sur le téléphone : télécharger **odelices-haccp.apk** ci-dessous, l'ouvrir et autoriser l'installation.
          files: odelices-haccp.apk
