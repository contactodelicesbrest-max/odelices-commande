<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <title>O'Délices — Borne de commande</title>
    <link rel="icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Moteur web trop ancien (tablette jamais mise à jour) : on explique comment faire
      (function () {
        var ok = window.CSS && CSS.supports && CSS.supports("display", "grid") && CSS.supports("--a", "0");
        if (ok) return;
        document.getElementById("root").innerHTML =
          '<div style="font-family:sans-serif;background:#15110f;color:#f7f1e8;min-height:100vh;padding:40px;box-sizing:border-box;text-align:center">' +
          '<h1 style="color:#e8452c">Mise à jour nécessaire</h1>' +
          '<p style="font-size:20px;max-width:640px;margin:20px auto;line-height:1.5">Le moteur d\'affichage de cette tablette est trop ancien.<br><br>' +
          'Ouvrez le <b>Play Store</b>, cherchez <b>« Android System WebView »</b> et touchez <b>Mettre à jour</b>.<br>' +
          'Mettez aussi à jour <b>Google Chrome</b>.<br><br>Puis relancez l\'application.</p></div>';
        window.__oldWebView = true;
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
