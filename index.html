<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <title>O'Délices — Borne de commande</title>
    <link rel="icon" href="./icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Ancien moteur web (tablette Android 5.1 jamais mise à jour) : styles de secours
      (function () {
        var html = document.documentElement;
        var sup = window.CSS && CSS.supports;
        if (!(sup && CSS.supports("display", "grid"))) html.className += " old-css";
        // l'espacement "gap" des blocs flex n'existe pas sur les vieux moteurs
        var d = document.createElement("div");
        d.style.display = "flex";
        d.style.flexDirection = "column";
        d.style.rowGap = "1px";
        d.appendChild(document.createElement("div"));
        d.appendChild(document.createElement("div"));
        document.documentElement.appendChild(d);
        var flexGap = d.scrollHeight === 1;
        d.parentNode.removeChild(d);
        if (!flexGap) html.className += " no-flexgap";
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
